				reg.then(function (r) { if (r != null) { return Promise.reject(new Error('Service worker already exists.')); } return r; }).then(function () { return engine.installServiceWorker(); }),
				new Promise(function (resolve) { setTimeout(resolve, 2000); }),
			]).then(function () { window.location.reload(); }).catch(function (err) { console.error('Error while registering service worker:', err); });
		} else {
			fail('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		}
		return;
	}
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				setPct(3 + 87 * current / total);
				if (current >= total && !S.downloaded) S.downloaded = performance.now() - S.t0;
			}
		},
	}).then(function () {
		S.started = performance.now() - S.t0;
		const crawl = setInterval(function () { if (gone) { clearInterval(crawl); return; } setPct(S.pct + (99 - S.pct) * 0.04); }, 250);
		setPct(93);
		setTimeout(function () { window.ezBootDone('tempo scaduto'); }, 25000);
	}, fail);
}());

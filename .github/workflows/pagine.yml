# Chiede a GitHub di ripubblicare il sito (GitHub Pages) a ogni modifica del ramo principale.
name: Pubblica il sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Nuova pubblicazione del sito
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds

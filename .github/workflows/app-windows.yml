# Costruisce l'app per Windows (installazione .exe) e la pubblica tra le "Release" del progetto.
# Parte da sola quando cambia app-src/ o la versione del gioco per l'app (app/version.json).
name: App Windows e Android
on:
  push:
    branches: [main]
    paths: ['app-src/**', 'app/version.json', 'app/UltimaZona.apk', '.github/workflows/app-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gioco dentro l'app
        shell: bash
        run: |
          mkdir -p app-src/game
          cp app/index.html app-src/game/index.html
          node -e "const v=require('./app/version.json').version;require('fs').writeFileSync('app-src/game/version.json',JSON.stringify({version:v}));const p=require('./app-src/package.json');p.version=v;require('fs').writeFileSync('app-src/package.json',JSON.stringify(p,null,1))"
      - name: Costruzione
        working-directory: app-src
        run: |
          npm install
          npx electron-builder --win nsis --x64 --publish never
      - name: Versione
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./app/version.json').version")" >> $GITHUB_OUTPUT
      - name: Pubblicazione
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.version }}
          name: Ultima Zona ${{ steps.v.outputs.version }} per PC e Android
          make_latest: true
          body: |
            **PC Windows** → scarica **UltimaZona-Setup.exe** e aprilo. Se compare "Windows ha protetto il PC": *Ulteriori informazioni → Esegui comunque* (l'app è nuova e non ancora firmata). Trovi Ultima Zona sul desktop; F11 per lo schermo intero.

            **Android** → scarica **UltimaZona.apk** dal telefono e aprilo. Se il telefono lo chiede, consenti l'installazione da questa fonte. Il tasto Indietro mette in pausa, due volte esce.

            Le app si aggiornano da sole: ogni nuova versione viene controllata, si usa al riavvio e, se qualcosa non parte, l'app torna da sola all'ultima versione che funzionava. I salvataggi restano.
          files: |
            app-src/dist/UltimaZona-Setup.exe
            app/UltimaZona.apk
